services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviprox}
      POSTGRES_USER: ${POSTGRES_USER:-serviprox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviprox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviprox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python seed_demo.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Postgres se configura aca y no en el .env: el host "db" solo resuelve
      # dentro de la red de compose, y dejarlo en el .env rompe los arranques
      # locales sin Docker (que caen a SQLite).
      POSTGRES_DB: ${POSTGRES_DB:-serviprox}
      POSTGRES_USER: ${POSTGRES_USER:-serviprox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviprox}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
